
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Occhiwebs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header class="site-header">
        <h1 class="site-title">Occhiwebs</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="../index.html" class="nav-link">Inicio</a></li>
                <li><a href="sobre-mi.html" class="nav-link">Sobre Mí</a></li>
                <li><a href="proyectos.html" class="nav-link">Proyectos</a></li>
                <li><a href="servicios.html" class="nav-link">Servicios</a></li>
                <li><a href="contacto.html" class="nav-link">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main class="site-main">
        <section class="content-section">
            <h2 class="section-title">Ponte en Contacto</h2>
            <p class="section-text">Si tenés alguna consulta o querés iniciar un nuevo proyecto web, completá el siguiente formulario y te responderemos a la brevedad.</p>
            
            <form class="contact-form">
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" class="form-input">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="tu@correo.com" class="form-input">
                </div>

                <div class="form-group">
                    <label for="presupuesto" class="form-label">Presupuesto estimado (USD):</label>
                    <input type="number" id="presupuesto" name="presupuesto" min="50" max="5000" required placeholder="Ej. 300" class="form-input">
                </div>

                <div class="form-group">
                    <label for="mensaje" class="form-label">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Contanos sobre tu proyecto..." class="form-input"></textarea>
                </div>

                <button type="submit" class="form-button">Enviar Mensaje</button>
            </form>
        </section>
    </main>
    <footer class="site-footer">
        <p>© 2026 - Tomas Ignacio Occhiuto | <a href="contacto.html" class="footer-link">Contáctanos</a></p>
    </footer>
</body>
</html>
